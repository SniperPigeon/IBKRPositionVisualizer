<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBKR 交易回看</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f7f9; --panel-2: #eef0f3; --line: #e3e6ea; --grid: #f0f2f5;
  --text: #16181d; --muted: #6b7280; --faint: #9aa1ab; --accent: #f08c1a;
  --up: #12a36b; --down: #e5384f; --xfer: #3b82f6; --opt: #9b5de5;
  --ma5: #f5a524; --ma10: #20a8d8; --ma20: #d64fc8; --ma30: #2f6fe4;
  --dif: #f5a524; --dea: #2f9bea; --pos: #8b93a1;
  --tip-bg: rgba(255,255,255,.97); --shadow: 0 6px 24px rgba(15,20,30,.14);
}
:root[data-theme="dark"] {
  --bg: #0f1014; --panel: #16181d; --panel-2: #1d2027; --line: #262a32; --grid: #1a1d23;
  --text: #e7e9ed; --muted: #8b919c; --faint: #5d636e; --accent: #ff9a2e;
  --up: #22b07d; --down: #f2495c; --xfer: #4f8ff7; --opt: #b07cf0;
  --ma5: #ffad33; --ma10: #3cc3f2; --ma20: #ea6ee0; --ma30: #3a7cf6;
  --dif: #ffad33; --dea: #3cb4f2; --pos: #9aa3b2;
  --tip-bg: rgba(29,32,39,.97); --shadow: 0 8px 28px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
  display: flex; overflow: hidden;
}
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
button, input, select { font: inherit; color: inherit; }

/* ---------- sidebar ---------- */
#side { width: 248px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 14px 14px 6px; font-weight: 650; font-size: 15px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
#acct { padding: 2px 14px 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
#acct b { color: var(--text); font-weight: 600; }
#acct .row { display: flex; justify-content: space-between; gap: 8px; }
.search { padding: 10px 10px 6px; }
.search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; }
.search input:focus { border-color: var(--accent); }
#symlist { list-style: none; margin: 0; padding: 4px 6px 10px; overflow-y: auto; flex: 1; min-height: 0; }
#symlist li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; }
#symlist li:hover { background: var(--panel-2); }
#symlist li.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
#symlist .s { font-weight: 600; }
#symlist .pl { text-align: right; font-size: 12px; }
#symlist .sub { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#symlist .grp { padding: 10px 10px 4px; color: var(--faint); font-size: 11px; cursor: default; display: block; }
#symlist .grp:hover { background: none; }
.side-foot { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.btn { padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }

/* ---------- main ---------- */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
#head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 14px 18px 8px; flex-wrap: wrap; }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.title .sym { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
.title .name { color: var(--muted); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title .px { font-size: 18px; font-weight: 600; }
.title .chg { font-weight: 500; }
.ysym { display: inline-flex; align-items: center; gap: 4px; color: var(--faint); font-size: 11.5px; }
.ysym input { width: 82px; padding: 1px 5px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11.5px; }
.ysym input:hover, .ysym input:focus { border-color: var(--line); outline: none; }
.head-right { display: flex; align-items: flex-end; gap: 14px; }
.eye-btn { flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.eye-btn:hover { color: var(--text); border-color: var(--muted); }
.eye-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.eye-btn svg { width: 17px; height: 17px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat .k { color: var(--muted); font-size: 11.5px; }
.stat .v { font-weight: 600; font-size: 14px; }

#toolbar { display: flex; align-items: center; gap: 10px; padding: 4px 18px 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; background: var(--panel); padding: 3px; border-radius: 9px; }
.tabs button { border: 0; background: transparent; padding: 4px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
.toggles { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; color: var(--muted); }
.toggles label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.toggles input { accent-color: var(--accent); margin: 0; }

#info { padding: 6px 18px 0; min-height: 26px; color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
#info b { color: var(--text); font-weight: 500; }
#info .src { margin-left: auto; color: var(--faint); }
#notice { margin: 6px 18px 0; padding: 6px 10px; border-radius: 7px; background: var(--panel); color: var(--muted); font-size: 12px; display: none; }

#chartWrap { position: relative; height: max(560px, calc(100vh - 230px)); margin: 4px 6px 0 18px; flex: none; }
#chart { position: absolute; inset: 0; }
#overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; z-index: 3; }
#overlay .mk { pointer-events: auto; cursor: pointer; }
#overlay text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
.legend { position: absolute; left: 4px; z-index: 4; font-size: 11.5px; pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; text-shadow: 0 0 3px var(--bg); }
#loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); z-index: 5; background: color-mix(in srgb, var(--bg) 60%, transparent); }
#tip { position: fixed; z-index: 50; display: none; min-width: 220px; max-width: 340px; padding: 10px 12px; border-radius: 10px; background: var(--tip-bg); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px; pointer-events: none; }
#tip .h { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
#tip table { width: 100%; border-collapse: collapse; }
#tip td { padding: 2px 0; }
#tip td.r { text-align: right; padding-left: 10px; }
#tip .sum { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; color: var(--muted); }

/* ---------- trades table ---------- */
#tradesSec { padding: 10px 18px 28px; }
#tradesSec h3 { margin: 6px 0 8px; font-size: 13.5px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
#tradesSec h3 span { color: var(--muted); font-weight: 400; font-size: 12px; }
.tbl-wrap { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 10px; }
table.trades { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
table.trades th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 10px; background: var(--panel); position: sticky; top: 0; z-index: 1; }
table.trades td { padding: 7px 10px; border-top: 1px solid var(--line); }
table.trades .r { text-align: right; }
table.trades tbody tr { cursor: pointer; }
table.trades tbody tr:hover { background: var(--panel); }
table.trades tbody tr.hl { background: color-mix(in srgb, var(--accent) 16%, transparent); }
table.trades tbody tr.off { opacity: .5; }
.side-pill { display: inline-block; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 5px; font-size: 11.5px; font-weight: 600; color: #fff; }
.adj { color: var(--faint); font-size: 11px; margin-left: 4px; }

/* ---------- empty / drop ---------- */
#drop { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(3px); }
#drop.show { display: flex; }
.dropbox { width: min(560px, calc(100vw - 32px)); padding: 30px 28px; border: 2px dashed var(--line); border-radius: 16px; background: var(--panel); text-align: center; }
#drop.over .dropbox { border-color: var(--accent); }
.dropbox h2 { margin: 0 0 6px; font-size: 18px; }
.dropbox p { color: var(--muted); margin: 6px 0; }
.dropbox ol { text-align: left; color: var(--muted); margin: 14px auto 18px; padding-left: 20px; max-width: 440px; }
.dropbox code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--text); }
.dropbox .err { color: var(--down); margin-top: 10px; display: none; }

@media (max-width: 820px) {
  body { flex-direction: column; overflow: auto; }
  #side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 230px; }
  #acct, .side-foot { display: none; }
  main { overflow: visible; }
  #head, #toolbar, #info, #tradesSec { padding-left: 16px; padding-right: 16px; }
  #chartWrap { margin: 4px 4px 0 16px; height: 620px; }
  .toggles { margin-left: 0; }
  .stats { gap: 12px; }
  .head-right { width: 100%; justify-content: space-between; }
  .stat { align-items: flex-start; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="dot"></span>IBKR 交易回看</div>
  <div id="acct"></div>
  <div class="search"><input id="q" placeholder="搜索代码…" autocomplete="off" spellcheck="false"></div>
  <ul id="symlist"></ul>
  <div class="side-foot">
    <button class="btn" id="addBtn" title="追加另一份账单（重复的成交只计一次）">＋ 追加 CSV</button>
    <button class="btn" id="themeBtn" title="切换深色/浅色">◐</button>
  </div>
</aside>

<main>
  <div id="head">
    <div>
      <div class="title">
        <span class="sym" id="hSym">—</span>
        <span class="name" id="hName"></span>
      </div>
      <div class="title" style="margin-top:2px">
        <span class="px num" id="hPx"></span>
        <span class="chg num" id="hChg"></span>
        <span class="ysym">Yahoo <input id="ysym" spellcheck="false" title="行情代码对不上时可以手动改，回车生效"></span>
      </div>
    </div>
    <div class="head-right">
      <div class="stats" id="stats"></div>
      <button class="eye-btn" id="privBtn" type="button" aria-pressed="false" title="截图模式：隐藏持仓数量和盈亏金额"></button>
    </div>
  </div>

  <div id="toolbar">
    <div class="tabs" id="tabs">
      <button data-iv="1d" class="on">日K</button>
      <button data-iv="1wk">周K</button>
      <button data-iv="1mo">月K</button>
      <button data-iv="60m">60分</button>
      <button data-iv="30m">30分</button>
    </div>
    <div class="tabs" id="adjTabs" title="前复权：按拆股和分红调整历史价格；不复权：显示原始成交价">
      <button data-adj="qfq" class="on">前复权</button>
      <button data-adj="none">不复权</button>
    </div>
    <button class="btn" id="refreshBtn" title="重新获取最近一段行情">↻ 刷新</button>
    <div class="toggles">
      <label><input type="checkbox" id="tgOpt" checked>期权</label>
      <label><input type="checkbox" id="tgXfer" checked>转入/转出</label>
      <label><input type="checkbox" id="tgCost" checked>成本线</label>
      <label><input type="checkbox" id="tgHiLo" checked>最高/最低</label>
      <label><input type="checkbox" id="tgRedUp">红涨绿跌</label>
    </div>
  </div>

  <div id="info"></div>
  <div id="notice"></div>

  <div id="chartWrap">
    <div id="chart"></div>
    <svg id="overlay"></svg>
    <div class="legend" id="lgMain"></div>
    <div class="legend" id="lgVol"></div>
    <div class="legend" id="lgMacd"></div>
    <div class="legend" id="lgPos"></div>
    <div id="loading">载入行情…</div>
  </div>

  <section id="tradesSec">
    <h3>成交记录 <span id="tradesSub"></span></h3>
    <div class="tbl-wrap">
      <table class="trades">
        <thead><tr>
          <th>时间 (ET)</th><th>方向</th><th>合约</th><th class="r">数量</th><th class="r">成交价</th>
          <th class="r">金额</th><th class="r">佣金</th><th class="r">已实现盈亏</th><th>代码</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="tip"></div>

<div id="drop" class="show">
  <div class="dropbox">
    <h2>拖入 IBKR 活动账单 CSV</h2>
    <p>账单只在你的浏览器里解析，不会上传到任何服务器。行情来自 Yahoo Finance，查询时只会发送股票代码和日期范围。</p>
    <ol>
      <li>IBKR 网页端 → <code>业绩和报告</code> → <code>报表</code> → <code>活动</code></li>
      <li>选择期间（可选“自定义日期范围”），格式选 <code>CSV</code>，下载</li>
      <li>拖到这里，或点下方按钮选择文件；多份账单可以一起选，重复的成交只计一次</li>
    </ol>
    <button class="btn primary" id="pickBtn">选择 CSV 文件</button>
    <div class="err" id="dropErr"></div>
  </div>
</div>
<input type="file" id="file" accept=".csv,text/csv" multiple hidden>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
